<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meja Registrasi Rakerwil PW IPM Kaltim</title>
  <meta name="theme-color" content="#1f6f5f">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body data-ui="m">

<div id="login-view" class="m-login-wrap" hidden>
  <div class="m-login">
    <span class="logo-mark">IPM</span>
    <h1>Meja Registrasi</h1>
    <p class="muted" style="margin-bottom:20px;font-size:14px">Khusus panitia.</p>
    <label class="field">
      <span class="label">Password admin</span>
      <input type="password" id="f-password" class="input" autocomplete="current-password">
    </label>
    <div class="field-err" id="login-err" hidden style="margin:-10px 0 14px"></div>
    <button class="btn btn-primary" id="btn-login" style="width:100%;padding:15px">Masuk</button>
  </div>
</div>

<div id="dash-view" hidden>
  <header class="m-admin-head">
    <div class="row">
      <div>
        <h1>Meja Registrasi</h1>
        <small id="last-update"></small>
      </div>
      <button class="btn-ikon" id="btn-refresh" aria-label="Muat ulang">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
    <div class="m-search">
      <input type="search" id="q" class="input" placeholder="Cari nama / pimpinan">
      <select id="filter" class="select">
        <option value="semua">Semua</option>
        <option value="belum-hadir">Belum hadir</option>
        <option value="hadir">Sudah hadir</option>
        <option value="belum-lunas">Belum lunas</option>
        <option value="cek">Bukti perlu dicek</option>
      </select>
    </div>
  </header>

  <div class="m-absen-toggle">
    <div>
      <span class="absen-status" id="absen-status">Absensi</span>
      <p>Buka/tutup scan QR absensi</p>
    </div>
    <label class="switch"><input type="checkbox" id="toggle-absen"><span></span></label>
  </div>

  <div class="m-stats">
    <div class="m-stat"><small>Hadir</small><b id="stat-hadir">0</b></div>
    <div class="m-stat"><small>Pimpinan lunas</small><b id="stat-lunas">0</b></div>
    <div class="m-stat"><small>Bukti perlu dicek</small><b id="stat-cek">0</b></div>
    <div class="m-stat"><small>Pimpinan terdaftar</small><b id="stat-pimpinan">0</b></div>
    <div class="m-stat"><small>Total peserta</small><b id="stat-peserta">0</b></div>
  </div>

  <div class="m-list" id="list"></div>

  <div class="m-admin-bawah ganti-tampilan">
    <a href="../cetak-qr.html" target="_blank">Cetak QR</a>
    <a href="#" id="btn-logout">Keluar</a>
    <a href="#" data-ganti-tampilan="d">Tampilan desktop</a>
  </div>
</div>

<script src="../shared/js/config.js"></script>
<script src="../shared/js/util.js"></script>
<script src="../shared/js/mock.js"></script>
<script src="../shared/js/api.js"></script>
<script src="../shared/js/admin.js"></script>
</body>
</html>
